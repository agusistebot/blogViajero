name: Actualizar noticias y publicar

on:
  # Cada 3 horas (en UTC). Cambiá el cron si querés más o menos frecuencia.
  schedule:
    - cron: "17 */3 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Cuando editás algo a mano (por ejemplo el ranking de agencias)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-y-publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Buscar y redactar noticias con Gemini
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-news.mjs

      - name: Descargar fotos nuevas
        run: node scripts/fetch-images.mjs
        continue-on-error: true

      - name: Guardar las noticias nuevas en el repositorio
        run: |
          git config user.name "robot-noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static/img
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias actualizadas $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Generar el sitio
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
